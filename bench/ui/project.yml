name: Bench
options:
  bundleIdPrefix: fr.magrin.bench
  deploymentTarget: { iOS: "17.0" }
settings:
  DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
  CODE_SIGN_STYLE: Automatic
targets:
  BenchHost:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties: { UILaunchScreen: {} }
  BenchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: BenchHost }]
    settings: { TEST_TARGET_NAME: BenchHost, GENERATE_INFOPLIST_FILE: YES }
schemes:
  Bench:
    build: { targets: { BenchHost: all, BenchUITests: [test] } }
    test: { targets: [BenchUITests] }
